apiVersion: v1
kind: ServiceAccount
metadata:
  name: admission-tap
  namespace: admission-tap
automountServiceAccountToken: false # the webhook never calls the API server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admission-tap
  namespace: admission-tap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admission-tap
  template:
    metadata:
      labels:
        app: admission-tap
      annotations:
        # The server reads the Secrets only at startup. deploy.sh fills in a hash
        # of the cert, key and token, so changing any of them rolls the Pod.
        checksum/secrets: "__SECRETS_CHECKSUM__"
    spec:
      serviceAccountName: admission-tap
      # Must cover -shutdown-delay (5s) plus the 10s graceful shutdown timeout.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          # The server flags are documented in docs/configuration.md; the
          # defaults apply (recording on). Add `args: [...]` here to change them.
          ports:
            - name: https
              containerPort: 8443
            - name: http # query API (plain HTTP)
              containerPort: 8080
          readinessProbe: # /healthz returns 503 during -shutdown-delay
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 2
          livenessProbe: # 20s * 3 failures = 60s, longer than -shutdown-delay
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            # The in-memory record store holds up to 32 MiB by default (-record-max-bytes).
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: certs
              mountPath: /etc/webhook/certs
              readOnly: true
            - name: api-token # bearer token for the query API (-api-token-file)
              mountPath: /etc/webhook/api-token
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: admission-tap-tls
        - name: api-token
          secret:
            secretName: admission-tap-api-token
            items:
              - key: token
                path: token
---
apiVersion: v1
kind: Service
metadata:
  name: admission-tap
  namespace: admission-tap
spec:
  selector:
    app: admission-tap
  ports:
    - name: https
      port: 443
      targetPort: https
    - name: http
      port: 80
      targetPort: http
