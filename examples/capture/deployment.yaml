# Creating this Deployment makes the controllers write more objects (a
# ReplicaSet, then a Pod); the capture webhook records those writes too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: admission-tap-capture-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          resources:
            requests: { cpu: 10m, memory: 16Mi }
